<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptides Daily Doses</title>
<style>
  :root{
    --bg:#f4f8fc; --panel:#ffffff; --panel2:#eaf3fb; --banner:#d7e9f8;
    --line:#a9c8e3; --navy:#1c3f63; --navy-soft:#2e5c8a; --muted:#5c7a97;
    --danger:#c0463f; --ok:#1f7a4d; --text:#1c3f63;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .mono{font-family:'Courier New',monospace;letter-spacing:.5px;}
  header{padding:24px 20px;background:var(--banner);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:42px;height:42px;border-radius:10px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px;flex-shrink:0;}
  h1{font-size:18px;margin:0;color:var(--navy);letter-spacing:.5px;}
  .sub{color:var(--navy-soft);font-size:13px;margin-top:2px;}
  main{max-width:900px;margin:0 auto;padding:22px 18px 80px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(28,63,99,.06);}
  .card h2{font-size:15px;margin:0 0 14px;color:var(--navy);border-bottom:1px solid var(--panel2);padding-bottom:10px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-soft);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:135px;}
  button,.btn{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:8px;
    font-weight:700;font-size:14px;cursor:pointer;display:inline-block;text-decoration:none;text-align:center;}
  button.ghost,.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--navy);font-weight:600;}
  button.ok{background:var(--ok);}
  button.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);
    font-weight:600;padding:5px 11px;font-size:12px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:82%;text-align:center;z-index:99;}
  .toast.show{opacity:1;}
  .hero{text-align:center;padding:26px 0 8px;}
  .hero .name{font-size:25px;font-weight:700;color:var(--navy);}
  .hint{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 14px;}
  .warn{background:#fff6e5;border:1px solid #e0b869;border-radius:10px;padding:12px 14px;
    font-size:12px;line-height:1.6;color:#7a5510;margin-bottom:14px;}
  .weekday{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;
    padding:5px 13px;border-radius:20px;margin-bottom:12px;}
  .stage{border:1px dashed var(--line);border-radius:10px;padding:12px;background:#fafdff;margin-bottom:14px;}
  .stagerow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 4px;border-bottom:1px solid var(--panel2);font-size:14px;}
  .stagerow:last-child{border-bottom:none;}
  .daychip{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;margin-bottom:8px;}
  .daychip .dnm{font-weight:700;font-size:14px;color:var(--navy);}
  .daychip .dct{font-size:12px;color:var(--muted);margin-top:2px;}
  .linkout{font-size:11px;word-break:break-all;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:11px;color:var(--navy);max-height:110px;overflow:auto;}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* Printed-card look */
  .dosecard{background:#fff;border:1px solid var(--navy-soft);border-radius:12px;
    overflow:hidden;margin-bottom:20px;box-shadow:0 1px 4px rgba(28,63,99,.10);}
  .dosecard-head{background:var(--banner);text-align:center;padding:15px 12px 13px;
    color:var(--navy);font-size:18px;letter-spacing:2px;line-height:1.25;border-bottom:1px solid var(--line);}
  .dosecard-head .plus{font-size:23px;font-weight:700;line-height:1;margin-bottom:3px;}
  .dosecard-body{padding:18px 16px 20px;}
  .field{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;}
  .flabel{font-weight:700;color:var(--navy);font-size:14px;white-space:nowrap;}
  .fline{flex:1;border-bottom:1px solid var(--line);padding-bottom:3px;font-size:14px;
    color:var(--navy-soft);min-height:20px;}
  .dosetable{width:100%;border-collapse:collapse;margin-top:16px;border:1px solid var(--navy-soft);}
  .dosetable th{background:var(--banner);color:var(--navy);text-align:center;
    font-size:13px;font-weight:700;padding:11px 8px;border:1px solid var(--navy-soft);}
  .dosetable td{text-align:center;font-size:14px;padding:13px 8px;border:1px solid var(--line);color:var(--navy);}
  .dosetable tr:nth-child(even) td{background:#f7fbff;}
  .molecule{display:flex;justify-content:center;margin-bottom:6px;}
  .row2field{display:flex;gap:16px;}
  .row2field .field{flex:1;}
  .cardfoot{text-align:center;font-style:italic;color:var(--navy-soft);font-size:12px;
    margin-top:16px;padding-top:12px;border-top:1px solid var(--panel2);}
  .helpbox{text-align:center;padding:20px 0 10px;}
  .helptitle{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .wabtn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;
    text-decoration:none;padding:11px 22px;border-radius:24px;font-weight:700;font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
